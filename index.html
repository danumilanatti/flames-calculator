<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoveLogic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Nunito:ital,wght@0,400;0,800;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .home { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .home-card { width: min(100%, 520px); text-align: center; padding: 2.2rem 1.5rem; border-radius: 28px; background: #fff3f0; box-shadow: 0 10px 30px rgba(229, 68, 109, 0.15); }
    .home-heart { font-size: 2rem; color: #b85c74; }
    .home-card h1 { font-family: "Nunito", sans-serif; font-weight: 800; font-size: clamp(2.4rem, 11vw, 3.4rem); color: #9b3a58; font-style: normal; letter-spacing: 0; margin: 0.4rem 0; }
    .home-sub { font-weight: 800; font-size: 1.2rem; color: #b85c74; }
    .home-line { border: 0; border-top: 2px solid #ebc9d0; margin: 1.5rem 0; }
    .home-tag { font-style: italic; font-weight: 800; font-size: 1.2rem; color: #7a5560; }
    .home-buttons { display: grid; gap: 0.8rem; margin-top: 1.8rem; }
    .home-buttons a { text-decoration: none; text-align: center; }
  </style>
</head>
<body>
  <main class="home">
    <section class="home-card">
      <div class="home-heart">&#9825;</div>
      <h1>LoveLogic</h1>
      <p class="home-sub">Where Love Meets Logic.</p>
      <hr class="home-line" />
      <p class="home-tag">Two names. A little magic. A playful story.</p>
      <div class="home-buttons">
        <a class="btn primary" href="flames.html">Discover Your FLAMES &#10024;</a>
        <a class="btn ghost" href="percentage.html">Love Percentage</a>
      </div>
    </section>
  </main>
</body>
</html>
